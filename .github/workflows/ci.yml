name: ZK-ARCHE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust reference — fmt, check, test, clippy, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REQUIRE_CARGO_AUDIT: "1"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        working-directory: rust
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Install pinned Rust security tooling
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Run Rust qualification
        run: bash ./scripts/ci-rust.sh

      - name: Upload Rust evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-reference-evidence
          path: rust/evidence/rust-ci.log
          if-no-files-found: ignore
          retention-days: 30

  c:
    name: Constrained C — build, tests, analysis, sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc
      REQUIRE_SANITIZERS: "1"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Install C build and analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cppcheck pkg-config libsodium-dev

      - name: Run constrained C qualification
        run: bash ./scripts/ci-c.sh

      - name: Upload constrained C evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: constrained-c-evidence
          path: c/evidence/c-ci.log
          if-no-files-found: ignore
          retention-days: 30

  formal:
    name: Formal assurance — ProVerif 2.05 exact-head gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Install ProVerif build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ocaml-nox

      - name: Build checksum-pinned ProVerif CLI
        run: |
          bash ./scripts/install-proverif.sh "$RUNNER_TEMP/proverif-2.05"
          echo "$RUNNER_TEMP/proverif-2.05/bin" >> "$GITHUB_PATH"

      - name: Run exact-head formal qualification
        run: bash ./scripts/ci-formal.sh

      - name: Upload formal evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-proverif-evidence
          path: evidence/formal/**
          if-no-files-found: ignore
          retention-days: 90

  conformance:
    name: Cross-language conformance — contracts and vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [rust, c]
    env:
      CC: gcc
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        working-directory: rust
        run: rustup show

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Install C conformance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsodium-dev

      - name: Run cross-language conformance
        run: bash ./scripts/ci-conformance.sh

      - name: Upload conformance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-language-conformance-evidence
          path: evidence/conformance/**
          if-no-files-found: ignore
          retention-days: 30

  ci-complete:
    name: CI complete — required capability gate
    runs-on: ubuntu-24.04
    needs: [rust, c, formal, conformance]
    if: ${{ always() }}
    steps:
      - name: Check required capability jobs
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          C_RESULT: ${{ needs.c.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
        run: |
          status=0
          for lane in RUST C FORMAL CONFORMANCE; do
            result_var="${lane}_RESULT"
            result="${!result_var}"
            if [ "$result" != "success" ]; then
              echo "${lane,,} capability failed: $result" >&2
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo "All required ZK-ARCHE capability lanes passed."
